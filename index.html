<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ADD: SEO + theming -->
    <title>Fort Knox Guards — Integrated Security & Risk Management Solutions Across Nigeria</title>
    <meta
      name="description"
      content="Protecting people, assets, and operations with intelligence-driven security. Fort Knox Guards delivers integrated guarding, security technology, and risk advisory across Nigeria."
    />
    <meta property="og:title" content="Fort Knox Guards" />
    <meta property="og:description" content="Integrated security and risk management solutions across Nigeria." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1520872020165-6a281f8c56b0?auto=format&fit=crop&w=1200&q=80" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c0e" />
    <!-- Optional: preconnect for image CDNs -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <!-- ... existing code ... -->
    <!-- removed duplicate title -->
    <!-- Optional: preload your click sound -->
    <link rel="preload" as="audio" href="/sounds/click.mp3" />
    <script>
      // Apply saved theme before React mounts to prevent flashing
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="antialiased bg-white text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
